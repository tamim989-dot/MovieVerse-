<!DOCTYPE html>
<html>

<head>

<title>{{movie.title}} - MovieVerse</title>

<style>

body{
    margin:0;
    background:#080808;
    color:white;
    font-family:Arial,sans-serif;
    padding:20px;
}


.back{

color:white;
text-decoration:none;
background:#e50914;
padding:10px 18px;
border-radius:8px;

}


.container{

max-width:900px;
margin:auto;

}



.movie-box{

background:#171717;
padding:25px;
border-radius:20px;
margin-top:20px;

}



.poster{

width:300px;
max-width:100%;
border-radius:15px;

}



.title{

font-size:40px;
color:#e50914;

}



.badge{

display:inline-block;
background:#e50914;
padding:8px 15px;
border-radius:20px;
margin:5px;

}



.section{

background:#222;
padding:20px;
border-radius:15px;
margin-top:20px;

}



button{

background:#e50914;
color:white;
border:none;
padding:14px 25px;
border-radius:10px;
font-size:18px;
cursor:pointer;

}



#videoBox{

display:none;
margin-top:20px;

}


video{

width:100%;
border-radius:15px;

}



</style>

</head>


<body>


<div class="container">


<a class="back" href="/">
⬅ Back Home
</a>



<div class="movie-box">



{% if movie.poster %}

<img class="poster" src="{{movie.poster.url}}">

{% endif %}



<h1 class="title">

{{movie.title}}

</h1>



<div class="badge">

{{movie.year}}

</div>


<div class="badge">

{{movie.genre}}

</div>




<div class="section">

<h2>
Story Explained
</h2>


<p>
{{movie.story}}
</p>


</div>





{% if movie.video %}


<div class="section">


<h2>
Watch Explanation
</h2>


<button onclick="showVideo()">

▶ Continue Watching

</button>



<div id="videoBox">


<video controls>

<source src="{{movie.video.url}}" type="video/mp4">

</video>


</div>



</div>



<script>

function showVideo(){

document.getElementById("videoBox").style.display="block";

}

</script>



{% endif %}




</div>


</div>


</body>

</html>
